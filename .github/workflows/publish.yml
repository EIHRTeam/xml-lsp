name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already recorded in package.json
        required: true
        type: string
      dist-tag:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next, beta]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Verify release request
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(pkg.name, '@eihrteam/xml-lsp')
          assert.equal(pkg.version, process.env.REQUESTED_VERSION?.replace(/^v/, ''))
          assert(!pkg.version.includes('-') || process.env.DIST_TAG !== 'latest', 'Choose next or beta for a prerelease')
          JS

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:package

      - name: Publish to npm using GitHub OIDC
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          npm publish "./dist/eihrteam-xml-lsp-${version}.tgz" --access public --provenance --tag "$DIST_TAG"
